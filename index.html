<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hypertrophy V7</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#020617;color:white}
.screen{display:none}
.active{display:block}
input{background:#020617;border:1px solid #334155}
</style>
</head>
<body class="max-w-md mx-auto bg-slate-950">

<div id="home" class="screen active p-4 pb-24">
  <div class="rounded-3xl p-6 bg-gradient-to-br from-blue-700 to-slate-900">
    <p class="text-blue-200 text-xs tracking-[0.3em]">HYPERTROPHY V7</p>
    <h1 class="text-4xl font-bold mt-2">82.0 kg</h1>
    <p class="text-slate-300">Objetivo 86 kg · Synergym</p>
    <div class="w-full h-2 rounded-full bg-slate-700 mt-4">
      <div class="h-2 rounded-full bg-green-400 w-1/2"></div>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-3 mt-4">
    <div class="bg-slate-900 rounded-2xl p-4">
      <p class="text-slate-400 text-sm">Racha</p>
      <h2 class="text-3xl font-bold">4 🔥</h2>
    </div>
    <div class="bg-slate-900 rounded-2xl p-4">
      <p class="text-slate-400 text-sm">PR</p>
      <h2 class="text-3xl font-bold">12 🏆</h2>
    </div>
  </div>

  <button onclick="openTab('workout')" class="w-full mt-4 bg-green-500 text-slate-900 font-bold py-3 rounded-xl">
    💪 Empezar entrenamiento
  </button>
</div>

<div id="workout" class="screen p-4 pb-24">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-bold">Lunes · Empuje</h2>
    <span id="counter" class="text-green-400">0/17</span>
  </div>

  <div id="list"></div>

  <button onclick="saveWorkout()" class="w-full bg-green-500 text-slate-900 font-bold py-3 rounded-xl mt-4">
    Guardar sesión
  </button>
</div>

<div id="stats" class="screen p-4 pb-24">
  <h2 class="text-xl font-bold mb-4">Estadísticas</h2>

  <div class="bg-slate-900 rounded-2xl p-4">
    <p class="text-slate-400">Sesiones</p>
    <h2 id="sessions" class="text-4xl font-bold">0</h2>
  </div>

  <div class="bg-slate-900 rounded-2xl p-4 mt-4">
    <p class="text-slate-400 mb-3">Progresión banca</p>
    <svg viewBox="0 0 300 120" class="w-full">
      <polyline fill="none" stroke="#22c55e" stroke-width="4"
        points="20,90 60,82 100,70 140,58 180,48 220,36 280,20"/>
      <g fill="#22c55e">
        <circle cx="20" cy="90" r="4"/>
        <circle cx="60" cy="82" r="4"/>
        <circle cx="100" cy="70" r="4"/>
        <circle cx="140" cy="58" r="4"/>
        <circle cx="180" cy="48" r="4"/>
        <circle cx="220" cy="36" r="4"/>
        <circle cx="280" cy="20" r="4"/>
      </g>
    </svg>
  </div>
</div>

<div id="profile" class="screen p-4 pb-24">
  <div class="bg-slate-900 rounded-2xl p-4">
    <h2 class="text-2xl font-bold">Adrián López</h2>
    <p class="text-slate-400">187 cm · 82 kg</p>

    <div class="mt-4 space-y-2">
      <div class="flex justify-between"><span>Rutina</span><b>4 días</b></div>
      <div class="flex justify-between"><span>Objetivo</span><b>Hipertrofia</b></div>
      <div class="flex justify-between"><span>Carrera</span><b>Sáb + Dom</b></div>
    </div>
  </div>
</div>

<nav class="fixed bottom-0 left-0 right-0 bg-slate-950 border-t border-slate-800">
  <div class="max-w-md mx-auto grid grid-cols-4 text-center py-3">
    <button onclick="openTab('home')">🏠</button>
    <button onclick="openTab('workout')">💪</button>
    <button onclick="openTab('stats')">📈</button>
    <button onclick="openTab('profile')">👤</button>
  </div>
</nav>

<script>
const exercises=[
["Press banca","20",4],
["Press militar","12.5",3],
["Press inclinado","17.5",3],
["Laterales","7.5",3],
["Tríceps","20",3]
];

function render(){
 const list=document.getElementById("list");
 list.innerHTML="";
 let done=0;

 exercises.forEach((e,i)=>{
  let sets="";
  for(let s=1;s<=e[2];s++){
    const k=`e${i}k${s}`;
    const r=`e${i}r${s}`;
    const kg=localStorage[k]||e[1];
    const rep=localStorage[r]||"";
    if(rep) done++;

    sets+=`
    <div class="grid grid-cols-2 gap-2 mb-2">
      <input id="${k}" value="${kg}" class="rounded-lg p-2" placeholder="Kg">
      <input id="${r}" value="${rep}" class="rounded-lg p-2" placeholder="Reps">
    </div>`;
  }

  list.innerHTML+=`
  <div class="bg-slate-900 rounded-2xl p-4 mb-3">
    <div class="flex justify-between mb-3">
      <div>
        <h3 class="font-semibold">${e[0]}</h3>
        <p class="text-xs text-slate-400">${e[1]} kg · ${e[2]} series</p>
      </div>
      <button onclick="timer(this,90)" class="bg-blue-600 px-3 rounded-full text-xs">
        90 s
      </button>
    </div>
    ${sets}
  </div>`;
 });

 document.getElementById("counter").innerText=`${done}/17`;
 document.getElementById("sessions").innerText=localStorage.sessions||0;
}

function timer(btn,t){
 btn.disabled=true;
 const id=setInterval(()=>{
   btn.innerText=t+"s";
   t--;
   if(t<0){
     clearInterval(id);
     btn.innerText="✓";
     btn.className="bg-green-600 px-3 rounded-full text-xs";
     btn.disabled=false;
   }
 },1000);
}

function saveWorkout(){
 exercises.forEach((e,i)=>{
   for(let s=1;s<=e[2];s++){
     localStorage[`e${i}k${s}`]=document.getElementById(`e${i}k${s}`).value;
     localStorage[`e${i}r${s}`]=document.getElementById(`e${i}r${s}`).value;
   }
 });
 localStorage.sessions=(+localStorage.sessions||0)+1;
 alert("Sesión guardada");
 render();
}

function openTab(id){
 document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}

render();
</script>
</body>
</html>
