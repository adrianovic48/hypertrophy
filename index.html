<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hypertrophy V6</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white">
  <div id="root"></div>
  <script>
    document.getElementById('root').innerHTML = `
      <main class="max-w-md mx-auto p-4 pb-24">
        <section class="rounded-3xl p-6 bg-gradient-to-br from-blue-900 to-slate-900">
          <p class="text-blue-200 text-xs tracking-[0.3em]">HYPERTROPHY</p>
          <h1 class="text-4xl font-bold mt-2">82.0 kg</h1>
          <p class="text-slate-300 mt-1">Objetivo 86 kg · Synergym</p>
        </section>

        <div class="grid grid-cols-2 gap-3 mt-4">
          <div class="bg-slate-900 rounded-2xl p-4">
            <p class="text-slate-400 text-sm">Racha</p>
            <h2 class="text-3xl font-bold">4 🔥</h2>
          </div>
          <div class="bg-slate-900 rounded-2xl p-4">
            <p class="text-slate-400 text-sm">PR</p>
            <h2 class="text-3xl font-bold">12 🏆</h2>
          </div>
        </div>

        <div class="bg-slate-900 rounded-2xl p-4 mt-4">
          <h3 class="font-semibold mb-3">Lunes · Empuje</h3>
          ${[
            ['Press banca','20 kg','4×6–8'],
            ['Press militar','12.5 kg','3×8–10'],
            ['Press inclinado','17.5 kg','3×10–12'],
            ['Laterales','7.5 kg','3×12–15'],
            ['Tríceps','20 kg','3×12–15']
          ].map(e=>`
            <div class="bg-slate-800 rounded-xl p-3 mb-3">
              <div class="flex justify-between items-center">
                <div>
                  <div class="font-semibold">${e[0]}</div>
                  <div class="text-xs text-slate-400">${e[1]} · ${e[2]}</div>
                </div>
                <button class="text-xs bg-blue-600 px-3 py-1 rounded-full">90 s</button>
              </div>
              <div class="grid grid-cols-2 gap-2 mt-3">
                <input placeholder="Kg" class="bg-slate-900 rounded-lg p-2 text-white" />
                <input placeholder="8-8-7-6" class="bg-slate-900 rounded-lg p-2 text-white" />
              </div>
            </div>`).join('')}
          <button id="save" class="w-full bg-green-500 text-slate-900 font-bold py-3 rounded-xl mt-2">Guardar entrenamiento</button>
          <p id="ok" class="hidden text-center text-green-400 mt-2">✓ Guardado</p>
        </div>
      </main>`;

    document.getElementById('save').onclick=()=>{
      document.getElementById('ok').classList.remove('hidden');
      setTimeout(()=>document.getElementById('ok').classList.add('hidden'),1500);
    }
  </script>
</body>
</html>
